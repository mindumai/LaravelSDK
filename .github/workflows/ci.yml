name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint check
        run: vendor/bin/pint --test

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          # SDKM-D2 (Docs/SDK_Own_MCP_Plan.md) — the floor is Laravel 9 /
          # PHP 8.1 now that the MCP layer is our own. Each older Laravel
          # line gets a floor-PHP and a ceiling-PHP leg; invalid pairs are
          # pinned via include rather than widening the cross-product.
          - php: '8.1'
            laravel: '9.*'
          - php: '8.2'
            laravel: '9.*'
          - php: '8.1'
            laravel: '10.*'
          - php: '8.3'
            laravel: '10.*'
          - php: '8.2'
            laravel: '11.*'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: |
          # Laravel 9 is EOL and carries known advisories; Composer refuses
          # to resolve it by default. Testing against it is the whole point
          # of that matrix leg (SDKM-D2), so lift the policy for CI installs.
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --display-deprecations
